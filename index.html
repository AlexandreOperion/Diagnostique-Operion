let currentDomain = 0;
let answers = {};
let clientName = '';
let respondentName = '';
let respondentRole = '';
let diagDate = new Date().toLocaleDateString('fr-FR');
DOMAINS.forEach(d => { answers[d.id] = {}; });

// NSP = -1 (exclu du calcul), 0 = non répondu, 1-5 = note
function getScore(domainId) {
  const qs = DOMAINS[domainId].questions;
  const ans = answers[domainId];
  const filled = Object.values(ans).filter(v => v > 0); // exclut 0 (vide) et -1 (NSP)
  if(filled.length === 0) return 0;
  return Math.round((filled.reduce((a,b) => a+b, 0) / (filled.length * 5)) * 100);
}

function isDone(domainId) {
  const qs = DOMAINS[domainId].questions;
  const ans = answers[domainId];
  return Object.keys(ans).length === qs.length && Object.values(ans).every(v => v !== 0);
}

function answeredCount(domainId) {
  return Object.values(answers[domainId]).filter(v => v !== 0).length;
}

function totalAnswered() {
  let t = 0;
  DOMAINS.forEach(d => { t += answeredCount(d.id); });
  return t;
}

function renderNav() {
  const nav = document.getElementById('domainNav');
  nav.innerHTML = DOMAINS.map(d => `
    <button class="domain-btn ${d.id===currentDomain?'active':''} ${isDone(d.id)?'done':''}" onclick="goTo(${d.id})">${d.short}</button>
  `).join('');
}

function renderProgress() {
  const total = DOMAINS.reduce((a,d) => a+d.questions.length, 0);
  const done = totalAnswered();
  const pct = Math.round(done/total*100);
  document.getElementById('prog').style.width = pct+'%';
  document.getElementById('progLabel').textContent = done+' / '+total+' questions répondues ('+pct+'%)';
}

function renderDomain() {
  const d = DOMAINS[currentDomain];
  const ans = answers[d.id];
  const total = d.questions.length;
  const done = answeredCount(d.id);

  document.getElementById('mainContent').innerHTML = `
    ${currentDomain === 0 ? `
    <div class="client-section no-print">
      <div style="font-size:13px;font-weight:600;color:#C9A84C;margin-bottom:12px">📋 Informations du répondant</div>
      <div class="client-grid">
        <div>
          <label>Nom de l'entreprise cliente</label>
          <input type="text" placeholder="Ex : Scierie des Gardes" value="${clientName}" oninput="clientName=this.value">
        </div>
        <div>
          <label>Date du diagnostic</label>
          <input type="text" placeholder="Ex : 12/04/2026" value="${diagDate}" oninput="diagDate=this.value">
        </div>
        <div>
          <label>Nom du répondant</label>
          <input type="text" placeholder="Ex : Jérémy Briffaud" value="${respondentName}" oninput="respondentName=this.value">
        </div>
        <div>
          <label>Fonction</label>
          <input type="text" placeholder="Ex : Directeur, Resp. Production…" value="${respondentRole}" oninput="respondentRole=this.value">
        </div>
      </div>
    </div>` : ''}
    <div class="section-title">${d.name}</div>
    <div class="section-sub">Évaluez chaque critère de 1 (inexistant) à 5 (excellente maîtrise) — ou "NSP" si vous ne savez pas</div>
    <div class="answered-count" id="ac">${done} / ${total} réponses</div>
    ${d.questions.map((q,i) => `
      <div class="question-card" id="qc-${i}">
        <div class="question-text"><span class="q-num">${i+1}.</span> ${q}</div>
        <div class="scale">
          <span class="scale-label">1</span>
          ${[1,2,3,4,5].map(v => `<button class="scale-btn ${ans[i]===v?'sel-'+v:''}" onclick="setAnswer(${i},${v})">${v}</button>`).join('')}
          <span class="scale-label">5</span>
          <div class="scale-sep"></div>
          <button class="btn-nsp ${ans[i]===-1?'sel-nsp':''}" onclick="setAnswer(${i},-1)" title="Ne sait pas / Sans réponse">NSP</button>
        </div>
        <div class="scale-legend"><span>Inexistant / Non pratiqué</span><span>Excellente maîtrise</span></div>
      </div>
    `).join('')}
    <div class="nav-btns no-print">
      ${currentDomain > 0 ? `<button class="btn" onclick="goTo(${currentDomain-1})">← Précédent</button>` : '<span></span>'}
      <button class="btn btn-danger" onclick="if(confirm('Réinitialiser toutes les réponses ?')){resetAll()}">Réinitialiser</button>
      ${currentDomain < DOMAINS.length-1
        ? `<button class="btn btn-primary" onclick="goTo(${currentDomain+1})">Suivant →</button>`

function goTo(id) {
  currentDomain = id;
  renderNav();
  renderProgress();
  renderDomain();
  window.scrollTo(0,0);
}

function setAnswer(qi, val) {
  answers[currentDomain][qi] = val;
  renderNav();
  renderProgress();
  const done = answeredCount(currentDomain);
  const total = DOMAINS[currentDomain].questions.length;
  document.getElementById('ac').textContent = done+' / '+total+' réponses';

  // Mise à jour visuelle boutons 1-5
  const scaleBtns = document.querySelectorAll(`#qc-${qi} .scale-btn`);
  scaleBtns.forEach((b,i) => {
    b.className = 'scale-btn' + (i+1===val ? ' sel-'+(i+1) : '');
  });
  // Mise à jour visuelle NSP
  const nspBtn = document.querySelector(`#qc-${qi} .btn-nsp`);
  if(nspBtn) nspBtn.className = 'btn-nsp' + (val===-1 ? ' sel-nsp' : '');
}

function resetAll() {
  DOMAINS.forEach(d => { answers[d.id] = {}; });
  goTo(0);
}

function getLevel(score) {
  if(score < 20) return {label:'Niveau 1 — Informel', color:'#A32D2D', bg:'#FCEBEB'};
  if(score < 40) return {label:'Niveau 2 — Émergent', color:'#854F0B', bg:'#FAEEDA'};
  if(score < 60) return {label:'Niveau 3 — Structuré', color:'#8B6A1F', bg:'#FBF6E9'};
  if(score < 80) return {label:'Niveau 4 — Maîtrisé', color:'#3B6D11', bg:'#EAF3DE'};
  return {label:'Niveau 5 — Excellence', color:'#173404', bg:'#d4edda'};
}

function buildEmailBody(scores, global, lvl) {
  const client = clientName || 'Entreprise non renseignée';
  const name   = respondentName || 'Non renseigné';
  const role   = respondentRole || 'Non renseigné';

  let lines = [];
  lines.push('=== DIAGNOSTIC OPERION ===');
  lines.push('');
  lines.push('Entreprise : ' + client);
  lines.push('Date       : ' + diagDate);
  lines.push('Répondant  : ' + name + ' — ' + role);
  lines.push('');
  lines.push('SCORE GLOBAL : ' + global + '%  →  ' + lvl.label);
  lines.push('');
  lines.push('─── SCORES PAR DOMAINE ───');
  DOMAINS.forEach((d, i) => {
    const lv = getLevel(scores[i]);
    lines.push(d.name + ' : ' + scores[i] + '%  (' + lv.label.split('—')[1].trim() + ')');
  });
  lines.push('');
  lines.push('─── RÉPONSES "NSP" (NE SAIT PAS) ───');
  let totalNspEmail = 0;
  DOMAINS.forEach(d => {
    const nspQs = d.questions.map((q, qi) => ({ qi, q })).filter(({ qi }) => answers[d.id][qi] === -1);
    if (nspQs.length > 0) {
      lines.push('');
      lines.push('▶ ' + d.name + ' (' + nspQs.length + ' NSP)');
      nspQs.forEach(({ qi, q }) => lines.push('  ' + (qi+1) + '. ' + q));
      totalNspEmail += nspQs.length;
    }
  });
  if (totalNspEmail === 0) lines.push('Aucun NSP enregistré.');
  lines.push('');
  DOMAINS.forEach((d, i) => {
    lines.push('');
    lines.push('▶ ' + d.name.toUpperCase());
    d.questions.forEach((q, qi) => {
      const val = answers[d.id][qi];
      let rep = '—';
      if(val === -1) rep = 'NSP';
      else if(val > 0) rep = val + '/5';
      lines.push('  ' + (qi+1) + '. ' + q);
      lines.push('     → ' + rep);
    });
  });
  lines.push('');
  lines.push('─────────────────────────────────────────');
  lines.push('Diagnostic réalisé par OPERION — Alex Klein-Rhein | Conseil en excellence opérationnelle');
  lines.push('OPERION — Alex Klein-Rhein');

  return lines.join('\n');
}

async function sendEmail(scores, global, lvl) {
  const statusEl = document.getElementById('mailStatus');
  const btn = document.getElementById('sendBtn');

  statusEl.className = 'mail-status sending';
  statusEl.textContent = '⏳ Envoi en cours…';
  if(btn) btn.disabled = true;

  const client = clientName || 'Entreprise non renseignée';
  const name   = respondentName || 'Non renseigné';
  const role   = respondentRole || 'Non renseigné';
  const body   = buildEmailBody(scores, global, lvl);
  const subject = '[OPERION] Diagnostic ' + client + ' — ' + name + ' (' + role + ') — ' + diagDate;

  const payload = {
    _subject: subject,
    _replyto: 'noreply@operion.fr',
    entreprise: client,
    repondant: name,
    fonction: role,
    date: diagDate,
    diagnostic: body
  };

  try {
    const res = await fetch('https://formspree.io/f/mpqbdjln', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (res.ok && data.ok) {
      statusEl.className = 'mail-status ok';
      statusEl.textContent = '✅ Diagnostic envoyé avec succès à operion.akr@gmail.com';
      if(btn) { btn.textContent = '✅ Envoyé'; }
    } else {
      const msg = (data.errors || []).map(e => e.message).join(', ') || ('Erreur ' + res.status);
      throw new Error(msg);
    }
  } catch(err) {
    statusEl.className = 'mail-status err';
    statusEl.textContent = '⚠️ Échec : ' + err.message + (err.message.includes('Failed to fetch') ? ' — Le fichier doit être hébergé en ligne (pas ouvert en local).' : '');
    if(btn) btn.disabled = false;
  }
}

function buildNspBlock(scores) {
  // Collecte tous les NSP par domaine
  const nspDomains = DOMAINS.map((d, i) => {
    const nspQs = d.questions
      .map((q, qi) => ({ qi, q }))
      .filter(({ qi }) => answers[d.id][qi] === -1);
    return { d, i, nspQs };
  }).filter(({ nspQs }) => nspQs.length > 0);

  const totalNsp = nspDomains.reduce((a, { nspQs }) => a + nspQs.length, 0);
  const totalQ   = DOMAINS.reduce((a, d) => a + d.questions.length, 0);

  if (totalNsp === 0) return '';

  const pct = Math.round(totalNsp / totalQ * 100);
  const alertColor = pct >= 20 ? '#A32D2D' : pct >= 10 ? '#854F0B' : '#6a3fb5';
  const alertBg    = pct >= 20 ? '#FCEBEB'  : pct >= 10 ? '#FAEEDA'  : '#f5f0ff';
  const alertBorder= pct >= 20 ? '#E24B4A'  : pct >= 10 ? '#EF9F27'  : '#9b6fd4';

  const domainsHtml = nspDomains.map(({ d, nspQs }) => `
    <div class="nsp-domain-row">
      <div style="flex:1">
        <div style="font-size:12px;font-weight:600;color:#1a1a1a;margin-bottom:4px">
          <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${d.color};margin-right:5px;vertical-align:middle"></span>
          ${d.name}
        </div>
        <div class="nsp-q-list">
          ${nspQs.map(({ qi, q }) => `
            <div class="nsp-q-item">
              <span class="nsp-q-num">${qi + 1}.</span>
              <span>${q}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="nsp-badge">${nspQs.length} NSP</div>
    </div>
  `).join('');

  return `
    <div class="nsp-block" style="border-color:${alertBorder}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div style="font-size:14px;font-weight:600;color:${alertColor}">
          ⚠️ Zones de non-visibilité — Réponses "NSP"
        </div>
        <div style="background:${alertBg};border:1px solid ${alertBorder};border-radius:20px;padding:3px 14px;font-size:12px;font-weight:700;color:${alertColor}">
          ${totalNsp} NSP / ${totalQ} questions (${pct}%)
        </div>
      </div>
      <p style="font-size:11px;color:#666;margin-bottom:12px;line-height:1.6">
        Un NSP (Ne Sait Pas) signale une zone de <strong>non-visibilité managériale</strong> : le répondant n'a pas accès à l'information nécessaire pour évaluer ce critère. 
        C'est un indicateur d'opacité interne à traiter au même titre qu'un score faible.
      </p>
      ${domainsHtml}
    </div>
  `;
}

      </div>

      <div class="radar-wrap">
        <canvas id="radarChart" role="img" aria-label="Radar de maturité OPERION sur 8 domaines">
          ${DOMAINS.map((d,i) => d.short+': '+scores[i]+'%').join(', ')}
        </canvas>
      </div>

      <div class="scores-grid">
        ${DOMAINS.map((d,i) => {
          const lv = getLevel(scores[i]);
          return `<div class="score-card" style="border-left-color:${d.color}">
            <div class="score-card-label">${d.name}</div>
            <div style="display:flex;align-items:baseline;gap:6px">
              <span class="score-card-val">${scores[i]}%</span>
              <span class="score-card-level" style="color:${lv.color}">${lv.label.split('—')[1].trim()}</span>
            </div>
          </div>`;
        }).join('')}
      </div>

      ${buildNspBlock(scores)}

      <div style="background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:1.25rem;margin-bottom:1.5rem">
        <div style="font-size:14px;font-weight:600;margin-bottom:0.75rem;color:#C9A84C">Domaines prioritaires à traiter</div>
        ${[...DOMAINS].map((d,i)=>({...d,score:scores[i]})).sort((a,b)=>a.score-b.score).slice(0,3).map((d,rank)=>{
          const lv = getLevel(d.score);
          return `<div style="display:flex;align-items:center;gap:12px;padding:0.6rem 0;border-bottom:1px solid #f0f0f0">
            <div style="width:24px;height:24px;border-radius:50%;background:${d.color};color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${rank+1}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${d.name}</div>
              <div style="font-size:11px;color:#888">${lv.label}</div>
            </div>
            <div style="font-size:20px;font-weight:700;color:${d.color}">${d.score}%</div>
          </div>`;
        }).join('')}
      </div>

      <div class="no-print" style="background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:1.25rem;margin-bottom:1.5rem">
        <div style="font-size:14px;font-weight:600;margin-bottom:8px;color:#C9A84C">📧 Envoyer le diagnostic à OPERION</div>
        <p style="font-size:12px;color:#666;margin-bottom:12px">Cliquez ci-dessous pour envoyer ce diagnostic complet (scores, NSP et toutes les réponses) directement à <strong>operion.akr@gmail.com</strong>. Aucune action supplémentaire requise.</p>
        <button id="sendBtn" class="btn btn-primary" onclick="sendEmail(_lastScores, _lastGlobal, _lastLvl)">📤 Envoyer le diagnostic à OPERION</button>
        <div id="mailStatus" class="mail-status"></div>
      </div>

      <div style="font-size:10px;color:#aaa;text-align:center;margin-top:1rem">
        Diagnostic réalisé par OPERION — Alex Klein-Rhein | Conseil en excellence opérationnelle
      </div>
    </div>
  `;

  setTimeout(() => {
    const ctx = document.getElementById('radarChart').getContext('2d');
    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: DOMAINS.map(d => d.short),
        datasets: [{
          label: 'Score (%)',
          data: scores,
          backgroundColor: 'rgba(24,95,165,0.12)',
          borderColor: '#C9A84C',
          borderWidth: 2,
          pointBackgroundColor: DOMAINS.map(d => d.color),
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          r: {
            min: 0, max: 100,
            ticks: { stepSize: 20, font: { size: 10 }, color: '#888', backdropColor: 'transparent' },
            pointLabels: { font: { size: 11, weight: '500' }, color: '#444' },
            grid: { color: 'rgba(0,0,0,0.07)' },
            angleLines: { color: 'rgba(0,0,0,0.07)' }
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  }, 100);
}

goTo(0);
</script>
</body>
</html>
